<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Gestion Hospitalière</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body class="dashboard-body">

<div class="sidebar">
    <h3>🏥 Hôpital</h3>
    <button onclick="showEntity('Patients')">Patients</button>
    <button onclick="showEntity('Medecins')">Médecins</button>
    <button onclick="showEntity('RendezVous')">Rendez-vous</button>
    <button onclick="showEntity('Services')">Services</button>
    <button onclick="showEntity('Chambres')">Chambres</button>
</div>

<div class="content">
    <h2 id="entityTitle">Sélectionnez une entité</h2>

    <div class="form">
        <input type="text" id="field1" placeholder="Champ 1">
        <input type="text" id="field2" placeholder="Champ 2">
        <div class="actions">
            <button onclick="addItem()">Ajouter</button>
            <button onclick="updateItem()">Modifier</button>
            <button class="logout-btn" onclick="logout()">Déconnexion</button>

        </div>
    </div>

    <ul id="list" class="list"></ul>
</div>

<script src="src/js/app.js"></script>
</body>
</html>
