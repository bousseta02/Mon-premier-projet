<<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - MyManager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <aside class="sidebar">
        <h2>MyManager</h2>
        <ul>
            <li onclick="loadEntity('patients')">Patients</li>
            <li onclick="loadEntity('medecins')">Médecins</li>
            <li onclick="loadEntity('rendezvous')">Rendez-vous</li>
            <li onclick="loadEntity('services')">Services</li>
            <li onclick="logout()">Déconnexion</li>
        </ul>
    </aside>

    <main class="content">
        <h1 id="page-title">Dashboard</h1>
        <div class="card">
            <form id="crud-form">
                <input type="text" id="field1" placeholder="Champ 1" required>
                <input type="text" id="field2" placeholder="Champ 2" required>
                <button type="submit">Ajouter</button>
            </form>
        </div>
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Champ 1</th>
                        <th>Champ 2</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </main>
</div>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
